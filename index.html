<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>WHS Lions - Pose Challenge Game</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="navbar bg-whs-black border-whs-red shadow-sm mb-4">
    <div class="container-fluid justify-content-center">
        <span class="navbar-brand mb-0 h1 text-white text-uppercase">Westminster High - Pose Challenge</span>
    </div>
</nav>

<div class="container">
    <div class="row g-4">
        <div class="col-lg-7">
            <div class="card shadow-sm border-0 mb-4">
                <div class="card-body text-center">
                    <div class="mb-3 text-start">
                        <label class="form-label small fw-bold text-muted">Upload Game Model (.zip)</label>
                        <input type="file" id="zip-upload" class="form-control" accept=".zip">
                    </div>
                    <div class="mb-3">
                        <button id="start-btn" class="btn btn-whs-red px-4" onclick="init()">Start Game</button>
                        <button id="stop-btn" class="btn btn-outline-secondary px-4" onclick="stop()" disabled>End Game</button>
                        <button id="restart-btn" class="btn btn-dark px-4" onclick="restartGame()">Restart</button>
                    </div>
                    <canvas id="canvas"></canvas>
                </div>
            </div>

            <div class="card shadow-sm border-0">
                <div class="card-body">
                    <h5 class="card-title mb-3 text-uppercase fw-bold text-center">Verification Signature</h5>
                    <canvas id="sig-canvas" height="150"></canvas>
                    <div class="d-flex justify-content-between mt-3">
                        <button class="btn btn-sm btn-light border" onclick="clearSig()">Clear</button>
                        <button class="btn btn-sm btn-whs-red" onclick="saveSig()">Confirm Signature</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-lg-5">
            <div class="card shadow-sm border-0 h-100">
                <div class="card-body text-center d-flex flex-column justify-content-center">
                    <div class="mb-4">
                        <div class="stats-label">Time Remaining</div>
                        <div id="game-timer" class="display-4">00:30</div>
                    </div>
                    
                    <div class="mb-4 border-top border-bottom py-4">
                        <div class="stats-label">Current Pose</div>
                        <div id="pose-number" class="game-display">-</div>
                    </div>

                    <div>
                        <div class="stats-label">Combo Score (6 ➔ 7)</div>
                        <div id="combo-counter" class="display-1 fw-bold">0</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@teachablemachine/pose@0.8/dist/teachablemachine-pose.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="script.js"></script>
</body>
</html>
